name: EBAC CI - Mobile

on:
  push:
    branches: [ci, main]
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android Emulator
        run: |
          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-29"
          sdkmanager "system-images;android-29;default;x86"

      - name: Criar emulador
        run: |
          echo "no" | avdmanager create avd \
            -n test \
            -k "system-images;android-29;default;x86" \
            --force

      - name: Iniciar emulador
        run: |
          nohup emulator \
            -avd test \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

          adb wait-for-device

          timeout 300 bash -c \
            'until adb shell getprop sys.boot_completed | grep -m 1 "1"; do sleep 5; done'

      - name: Verificar dispositivo
        run: adb devices

      - name: Rodar testes
        run: npm test