name: EBAC CI - Mobile

on:
  push:
    branches:
      - ci
      - main
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar estrutura dos testes
        shell: bash
        run: |
          echo "========================================"
          echo "TESTES ENCONTRADOS"
          echo "========================================"

          find . -type f \
            \( -name "*.test.js" -o -name "*.spec.js" \) \
            -print

      - name: Verificar teste de cadastro
        shell: bash
        run: |
          if [ ! -f "./test/specs/Cadastro.test.js" ]; then
            echo "========================================"
            echo "ERRO: TESTE NÃO ENCONTRADO"
            echo "========================================"

            echo "Procurado:"
            echo "./test/specs/Cadastro.test.js"

            echo ""
            echo "Testes disponíveis:"
            find . -type f \
              \( -name "*.test.js" -o -name "*.spec.js" \) \
              -print

            exit 1
          fi

          echo "Teste encontrado com sucesso!"

      - name: Verificar APK
        shell: bash
        run: |
          if [ ! -f "./apps/ebacshop.apk" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh ./apps/ebacshop.apk

      - name: Executar testes Mobile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36.0
          target: default
          arch: x86
          profile: Ebac

          force-avd-creation: true

          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect

          disable-animations: true

          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M

          emulator-boot-timeout: 600

          script: |
            echo "========================================"
            echo "ANDROID"
            echo "========================================"

            adb devices

            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell getprop sys.boot_completed

            echo "========================================"
            echo "INICIANDO APPIUM"
            echo "========================================"

            npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

            sleep 10

            echo "========================================"
            echo "VERIFICANDO APPIUM"
            echo "========================================"

            curl --fail http://127.0.0.1:4723/status

            echo ""
            echo "========================================"
            echo "APPIUM OK"
            echo "========================================"

            echo "========================================"
            echo "EXECUTANDO TESTES"
            echo "========================================"

            npm test

      - name: Upload do log do Appium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore