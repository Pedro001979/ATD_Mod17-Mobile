name: EBAC CI - Mobile

on:
  push:
    branches:
      - ci
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar estrutura dos testes
        shell: bash
        run: |
          echo "========================================"
          echo "TESTES ENCONTRADOS"
          echo "========================================"

          find . -type f \
            \( -name "*.test.js" -o -name "*.spec.js" \) \
            -print

      - name: Verificar teste de cadastro
        shell: bash
        run: |
          if [ ! -f "./test/specs/Cadastro.test.js" ]; then
            echo "========================================"
            echo "ERRO: TESTE NÃO ENCONTRADO"
            echo "========================================"
            echo "Procurado: ./test/specs/Cadastro.test.js"
            echo ""
            echo "Testes disponíveis:"

            find ./test -type f \
              \( -name "*.test.js" -o -name "*.spec.js" \) \
              -print

            exit 1
          fi

          echo "Teste de cadastro encontrado com sucesso!"

      - name: Verificar Page Objects
        shell: bash
        run: |
          echo "========================================"
          echo "PAGE OBJECTS"
          echo "========================================"

          if [ ! -d "./test/pageobjects" ]; then
            echo "ERRO: pasta test/pageobjects não encontrada!"
            exit 1
          fi

          find ./test/pageobjects -maxdepth 1 -type f -print

      - name: Verificar APK
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          if [ ! -f "./apps/ebacshop.apk" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh ./apps/ebacshop.apk
          file ./apps/ebacshop.apk

      - name: Habilitar KVM
        shell: bash
        run: |
          echo "========================================"
          echo "CONFIGURANDO KVM"
          echo "========================================"

          if [ ! -e /dev/kvm ]; then
            echo "ERRO: /dev/kvm não existe neste runner."
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM DISPONÍVEL!"
          else
            echo "ERRO: KVM não está acessível."
            exit 1
          fi

      - name: Executar testes Mobile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true

          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect

          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M
          emulator-boot-timeout: 600

          script: |
            set -e

            echo "========================================"
            echo "ANDROID"
            echo "========================================"

            adb wait-for-device
            adb devices

            echo "Android:"
            adb shell getprop ro.build.version.release

            echo "API:"
            adb shell getprop ro.build.version.sdk

            echo "Boot:"
            adb shell getprop sys.boot_completed

            echo "========================================"
            echo "INICIANDO APPIUM"
            echo "========================================"

            npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
            APPIUM_PID=$!

            echo "Appium PID: ${APPIUM_PID}"

            echo "Aguardando Appium ficar disponível..."

            for i in {1..30}; do
              if curl -sf http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium está pronto!"
                break
              fi

              if ! kill -0 "${APPIUM_PID}" 2>/dev/null; then
                echo "ERRO: Appium encerrou antes de ficar disponível."
                cat appium.log || true
                exit 1
              fi

              echo "Tentativa ${i}/30..."
              sleep 2
            done

            echo ""
            echo "========================================"
            echo "VERIFICANDO APPIUM"
            echo "========================================"

            curl --fail http://127.0.0.1:4723/status

            echo ""
            echo "========================================"
            echo "APPIUM OK"
            echo "========================================"

            echo ""
            echo "========================================"
            echo "EXECUTANDO WDIO"
            echo "========================================"

            npm test

      - name: Upload do log do Appium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "GERANDO ALLURE REPORT"
          echo "========================================"

          rm -rf ./allure-report
          mkdir -p ./allure-report

          if [ -d "./allure-results" ] && find ./allure-results -type f -print -quit | grep -q .; then
            echo "allure-results encontrado."

            npx allure generate ./allure-results \
              --clean \
              -o ./allure-report

            echo "========================================"
            echo "ALLURE REPORT GERADO"
            echo "========================================"

            test -f ./allure-report/index.html
            ls -lah ./allure-report
          else
            echo "AVISO: nenhum resultado Allure foi encontrado."
            echo "Criando página informativa para evitar deploy inválido."

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="pt-BR">' \
              '<head>' \
              '<meta charset="UTF-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1.0">' \
              '<title>Allure Report</title>' \
              '</head>' \
              '<body>' \
              '<h1>Allure Report</h1>' \
              '<p>Nenhum resultado Allure foi gerado nesta execução.</p>' \
              '</body>' \
              '</html>' \
              > ./allure-report/index.html

            test -f ./allure-report/index.html
            ls -lah ./allure-report
          fi

      - name: Deploy to GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true
