name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [main, master, ci]
  pull_request:
    branches: [main, master, ci]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Baixar arquivos Git LFS
        run: git lfs pull

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Verificar Driver UiAutomator2
        run: npx appium driver list --installed

      - name: Iniciar Servidor Appium
        run: |
          npx appium --port 4723 --log-level info > appium.log 2>&1 &
          i=1
          while [ "$i" -le 30 ]; do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium iniciado com sucesso!"
              break
            fi
            echo "Aguardando Appium... tentativa $i/30"
            sleep 2
            i=$((i + 1))
          done
          curl -sf http://127.0.0.1:4723/status

      - name: Verificar APK
        run: |
          test -f ./apps/ebacshop.apk || { echo 'ERRO: APK não encontrado'; exit 1; }
          ls -lh ./apps/ebacshop.apk
          file ./apps/ebacshop.apk

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set +e

            echo '=========================================='
            echo 'DISPOSITIVO ANDROID'
            echo '=========================================='
            adb devices
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell pm list packages | grep br.com.lojaebac || true

            echo '=========================================='
            echo 'EXECUTANDO TESTES'
            echo '=========================================='
            npm test
            TEST_EXIT=$?

            if [ "$TEST_EXIT" -ne 0 ]; then
              echo '=========================================='
              echo 'TESTE FALHOU - DIAGNÓSTICO'
              echo '=========================================='

              mkdir -p ./errorShots

              echo '--- ACTIVITY ATUAL ---'
              adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true

              echo '--- UI HIERARCHY ---'
              adb shell uiautomator dump /sdcard/window.xml || true
              adb exec-out cat /sdcard/window.xml > ./errorShots/window.xml || true
              cat ./errorShots/window.xml || true

              echo '--- SCREENSHOT ---'
              adb exec-out screencap -p > ./errorShots/failure.png || true

              echo '--- APP PROCESS / ACTIVITY ---'
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|mFocusedActivity|br.com.lojaebac' || true

              echo '--- LOGCAT DE ERROS ---'
              adb logcat -d | grep -iE 'error|exception|fatal|crash|androidruntime' | tail -200 || true

              exit "$TEST_EXIT"
            fi

            echo '=========================================='
            echo 'TESTES FINALIZADOS COM SUCESSO'
            echo '=========================================='

      - name: Upload Logs do Appium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore

      - name: Upload Evidências de Falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-evidence
          path: |
            ./errorShots
            ./screenshots
          if-no-files-found: ignore
