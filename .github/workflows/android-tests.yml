name: Mobile Tests - WebdriverIO + Appium

on:
  push:
    branches: [main, master, ci]
  pull_request:
    branches: [main, master, ci]
  workflow_dispatch:

permissions:
  contents: read

env:
  APPIUM_HOME: ${{ runner.temp }}/appium

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install dependencies
        run: npm ci

      - name: Prepare UiAutomator2 driver
        run: |
          mkdir -p "$APPIUM_HOME"

          if npx appium driver list --installed | grep -qi 'uiautomator2'; then
            echo 'UiAutomator2 is already installed; updating it when possible.'
            npx appium driver update uiautomator2 --unsafe || true
          else
            echo 'UiAutomator2 is not installed; installing the latest release.'
            npx appium driver install uiautomator2
          fi

          npx appium driver list --installed

      - name: Verify project
        run: |
          node --version
          npm --version
          npx appium --version
          npx appium driver list --installed
          test -f apps/ebacshop.apk
          file apps/ebacshop.apk

      - name: Run Android tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot-load
            -no-snapshot-save
            -no-metrics
            -camera-back none
            -camera-front none
          disable-animations: false
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail

            echo 'Checking Android device...'
            for i in $(seq 1 30); do
              state=$(adb get-state 2>/dev/null || true)
              if [ "$state" = "device" ]; then
                break
              fi
              echo "ADB state: ${state:-unavailable} ($i/30)"
              sleep 2
            done

            if [ "$(adb get-state 2>/dev/null || true)" != "device" ]; then
              echo 'Android device is not online.'
              adb devices -l || true
              exit 1
            fi

            adb devices -l
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk

            echo 'Starting Appium...'
            npx appium --port 4723 --base-path / > appium.log 2>&1 &
            APPIUM_PID=$!
            trap 'kill "$APPIUM_PID" 2>/dev/null || true' EXIT

            echo 'Waiting for Appium...'
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:4723/status >/dev/null; then
                break
              fi
              if ! kill -0 "$APPIUM_PID" 2>/dev/null; then
                echo 'Appium stopped unexpectedly.'
                cat appium.log || true
                exit 1
              fi
              sleep 2
            done

            curl --fail --silent --show-error http://127.0.0.1:4723/status
            echo

            echo 'Running WebdriverIO tests...'
            npm test

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-diagnostics
          path: |
            appium.log
            errorShots/
            screenshots/
            allure-results/
          if-no-files-found: ignore
