name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [main, master, ci]
  pull_request:
    branches: [main, master, ci]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -disk 4096
          disable-animations: true
          script: |
            set -e
            echo "========================================"
            echo "Aguardando emulador ficar pronto..."
            echo "========================================"
            
            # Aguardar device ficar online
            timeout 300 adb wait-for-device
            sleep 10
            
            # Verificar boot completo
            for i in {1..30}; do
              if adb shell getprop sys.boot_completed | grep -q 1; then
                echo "Emulador iniciou com sucesso!"
                break
              fi
              echo "Aguardando boot... ($i/30)"
              sleep 5
            done
            
            adb devices
            adb shell getprop ro.build.version.release
            
            echo "========================================"
            echo "Iniciando Appium na porta 4723..."
            echo "========================================"
            nohup npx appium --port 4723 --log-level info > appium.log 2>&1 &
            APPIUM_PID=$!
            echo "Appium PID: $APPIUM_PID"
            
            echo "========================================"
            echo "Aguardando Appium ficar pronto..."
            echo "========================================"
            sleep 20
            
            # Verificar se Appium está respondendo
            max_attempts=10
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              if curl -s http://127.0.0.1:4723/status | grep -q "value"; then
                echo "Appium está respondendo!"
                break
              fi
              echo "Aguardando Appium responder... ($attempt/$max_attempts)"
              sleep 3
              attempt=$((attempt + 1))
            done
            
            echo "========================================"
            echo "Executando testes WebdriverIO..."
            echo "========================================"
            npm test || TEST_EXIT=$?
            
            echo "========================================"
            echo "Limpando processos..."
            echo "========================================"
            kill $APPIUM_PID 2>/dev/null || true
            sleep 2
            
            exit ${TEST_EXIT:-0}

      - name: Upload evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            errorShots
            screenshots
            allure-results
            appium.log
          if-no-files-found: ignore