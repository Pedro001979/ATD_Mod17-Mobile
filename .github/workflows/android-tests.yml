name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [main, master, ci]

  pull_request:
    branches: [main, master, ci]

  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0


      # ==========================================
      # GIT LFS
      # ==========================================

      - name: Baixar arquivos Git LFS
        run: |
          echo "Baixando arquivos Git LFS..."
          git lfs pull


      # ==========================================
      # VERIFICAR APK
      # ==========================================

      - name: Verificar arquivo do app
        run: |
          echo "================================="
          echo "        ARQUIVO DO APP"
          echo "================================="

          ls -lh apps

          echo ""
          echo "Tipo do arquivo:"
          file apps/ebacshop.apk

          echo ""
          echo "Tamanho:"
          du -h apps/ebacshop.apk

          echo ""
          echo "Primeiros bytes:"
          head -c 4 apps/ebacshop.apk | xxd


      # ==========================================
      # JAVA
      # ==========================================

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # NODE
      # ==========================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      # ==========================================
      # DEPENDÊNCIAS
      # ==========================================

      - name: Instalar dependências
        run: |
          npm ci


      # ==========================================
      # VERIFICAR VERSÕES
      # ==========================================

      - name: Verificar versões
        run: |
          echo "================================="
          echo "            NODE"
          echo "================================="
          node -v

          echo ""
          echo "================================="
          echo "            NPM"
          echo "================================="
          npm -v

          echo ""
          echo "================================="
          echo "           APPIUM"
          echo "================================="
          npx appium --version

          echo ""
          echo "================================="
          echo "       APPIUM PACKAGE"
          echo "================================="
          npm ls appium

          echo ""
          echo "================================="
          echo "       UIAUTOMATOR2"
          echo "================================="
          npm ls appium-uiautomator2-driver


      # ==========================================
      # ANDROID EMULATOR + TESTES
      # ==========================================

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2

        with:

          # Android mais compatível com o projeto
          api-level: 30

          target: google_apis

          arch: x86_64

          profile: pixel

          disable-animations: true

          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics

          script: |

            echo "================================="
            echo "       AGUARDANDO ANDROID"
            echo "================================="

            adb wait-for-device

            echo ""
            echo "================================="
            echo "       ANDROID DEVICES"
            echo "================================="

            adb devices

            echo ""
            echo "================================="
            echo "             APK"
            echo "================================="

            ls -lh apps/ebacshop.apk

            file apps/ebacshop.apk

            echo ""
            echo "================================="
            echo "            APPIUM"
            echo "================================="

            npx appium --version

            echo ""
            echo "================================="
            echo "       INICIANDO TESTES"
            echo "================================="

            npm test


      # ==========================================
      # LOGCAT
      # ==========================================

      - name: Capturar Logcat
        if: always()
        continue-on-error: true
        run: |
          echo "Tentando capturar Logcat..."

          if adb get-state 2>/dev/null | grep -q "device"; then
            timeout 15s adb logcat -d > logcat.txt || true
          else
            echo "Emulador não está disponível."
            echo "Nenhum logcat foi capturado." > logcat.txt
          fi

          echo "Logcat finalizado."


      # ==========================================
      # UPLOAD LOGCAT
      # ==========================================

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: logcat

          path: logcat.txt

          if-no-files-found: ignore


      # ==========================================
      # ALLURE
      # ==========================================

      - name: Upload Allure
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: allure-results

          path: allure-results

          if-no-files-found: ignore


      # ==========================================
      # SCREENSHOTS
      # ==========================================

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: screenshots

          path: |
            ./errorShots
            ./screenshots

          if-no-files-found: ignore