name: EBAC CI - Mobile

on:
  push:
    branches:
      - ci
      - main
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar APK
        run: |
          echo "Verificando APK..."

          if [ ! -f "./apps/ebacshop.apk" ]; then
            echo "ERRO: apps/ebacshop.apk não encontrado!"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          ls -lh ./apps/ebacshop.apk
          file ./apps/ebacshop.apk

      - name: Executar testes Mobile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600

          script: |
            echo "========================================"
            echo "DISPOSITIVO"
            echo "========================================"

            adb devices

            echo "Android:"
            adb shell getprop ro.build.version.release

            echo "API:"
            adb shell getprop ro.build.version.sdk

            echo "Boot:"
            adb shell getprop sys.boot_completed

            echo "========================================"
            echo "INICIANDO APPIUM"
            echo "========================================"

            npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

            sleep 10

            echo "Verificando Appium..."

            curl --fail http://127.0.0.1:4723/status

            echo "========================================"
            echo "APPIUM OK"
            echo "========================================"

            echo "========================================"
            echo "EXECUTANDO TESTES"
            echo "========================================"

            npm test

      - name: Salvar log do Appium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore