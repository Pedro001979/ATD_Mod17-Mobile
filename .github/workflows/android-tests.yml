name: EBAC CI - Mobile

on:
  push:
    branches:
      - ci
      - main
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android Emulator
        run: |
          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;x86_64"

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses || true

      - name: Criar AVD
        run: |
          echo "no" | avdmanager create avd \
            --name test \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

      - name: Iniciar Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            echo "Android iniciado!"
            adb devices
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk

      - name: Verificar APK
        run: |
          if [ ! -f "./apps/ebacshop.apk" ]; then
            echo "ERRO: apps/ebacshop.apk não encontrado!"
            ls -la apps/
            exit 1
          fi

          ls -lh ./apps/ebacshop.apk
          file ./apps/ebacshop.apk

      - name: Iniciar Appium
        run: |
          npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

          sleep 5

          curl --fail http://127.0.0.1:4723/status

      - name: Rodar testes mobile
        run: npm test

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-logs
          path: |
            appium.log