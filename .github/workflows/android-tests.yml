name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [ main, master, ci ]
  pull_request:
    branches: [ main, master, ci ]
  workflow_dispatch:

    
jobs:
  test:
    runs-on: macos-13 # Usar macos-13 garante suporte x86_64 estável para o emulador Android

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm test