name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [main, master, ci]

  pull_request:
    branches: [main, master, ci]

  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0


      # ==========================================
      # GIT LFS
      # ==========================================

      - name: Baixar arquivos Git LFS
        run: |
          git lfs pull


      # ==========================================
      # VERIFICAR APK
      # ==========================================

      - name: Verificar APK
        run: |
          echo "======= APK ======="

          ls -lh apps

          file apps/ebacshop.apk

          du -h apps/ebacshop.apk

          echo "Primeiros bytes:"
          head -c 4 apps/ebacshop.apk | xxd


      # ==========================================
      # JAVA
      # ==========================================

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # NODE
      # ==========================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      # ==========================================
      # DEPENDÊNCIAS
      # ==========================================

      - name: Instalar dependências
        run: |
          npm ci


      # ==========================================
      # VERIFICAR INSTALAÇÃO
      # ==========================================

      - name: Verificar versões
        run: |
          echo "======= NODE ======="
          node -v

          echo "======= NPM ======="
          npm -v

          echo "======= APPIUM ======="
          npx appium --version

          echo "======= APPIUM PACKAGE ======="
          npm ls appium

          echo "======= UIAUTOMATOR2 ======="
          npm ls appium-uiautomator2-driver


      # ==========================================
      # ANDROID EMULATOR
      # ==========================================

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics

          script: |
            echo "================================="
            echo "        AGUARDANDO DEVICE"
            echo "================================="

            adb wait-for-device

            echo ""
            echo "================================="
            echo "        ANDROID DEVICES"
            echo "================================="

            adb devices

            echo ""
            echo "================================="
            echo "        BOOT COMPLETED"
            echo "================================="

            while [ "$(adb shell getprop sys.boot_completed 2>&1)" != "1" ]; do sleep 2; done

            echo "Android boot concluído com sucesso!"

            echo ""
            echo "================================="
            echo "             APK"
            echo "================================="

            ls -lh apps/ebacshop.apk

            file apps/ebacshop.apk

            echo ""
            echo "================================="
            echo "            APPIUM"
            echo "================================="

            npx appium --version

            echo ""
            echo "================================="
            echo "        INICIANDO TESTES"
            echo "================================="

            npm test


      # ==========================================
      # LOGCAT
      # ==========================================

      - name: Capturar Logcat
        if: always()
        continue-on-error: true
        run: |

          echo "Tentando capturar Logcat..."

          if adb get-state 2>/dev/null | grep -q "device"; then

            timeout 15s adb logcat -d > logcat.txt || true

          else

            echo "Emulador não está disponível." > logcat.txt

          fi

          echo "Logcat finalizado."


      # ==========================================
      # UPLOAD LOGCAT
      # ==========================================

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore


      # ==========================================
      # ALLURE
      # ==========================================

      - name: Upload Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore


      # ==========================================
      # SCREENSHOTS
      # ==========================================

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ./errorShots
            ./screenshots
          if-no-files-found: ignore