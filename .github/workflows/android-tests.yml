name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [main, master, ci]
  pull_request:
    branches: [main, master, ci]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Baixa arquivos grandes do Git LFS (APK)
      - name: Baixar arquivos Git LFS
        run: git lfs pull

      # 3. Configura o Java 17
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configura o Node.js 20
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 5. Instala as dependências do projeto
      - name: Instalar dependências
        run: npm ci

      # 6. Inicia o emulador e roda os testes
      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          script: npm test

      # 7. Salva evidências de erro (se houver)
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ./errorShots
            ./screenshots
          if-no-files-found: ignore