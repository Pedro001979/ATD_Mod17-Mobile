name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [main, master, ci]
  pull_request:
    branches: [main, master, ci]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Baixar arquivos Git LFS
        run: git lfs pull

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Driver UiAutomator2 Globalmente
        run: npx appium driver install uiautomator2 || true

      - name: Iniciar Servidor Appium em Background
        run: |
          npx appium --port 4723 --log-level info > appium.log 2>&1 &
          sleep 5

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          script: npm test

      - name: Upload Logs do Appium (se falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ./errorShots
            ./screenshots
          if-no-files-found: ignore