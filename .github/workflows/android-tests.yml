name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [ main, master, ci ]
  pull_request:
    branches: [ main, master, ci ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Baixar arquivos Git LFS
        run: git lfs pull

      - name: Verificar arquivo do app
        run: |
          ls -lh apps
          file apps/ebacshop.apks
          head -c 20 apps/ebacshop.apks | xxd

      - name: Habilitar KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo chmod 666 /dev/kvm

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          sudo mv bundletool-all-1.18.1.jar /usr/local/bin/bundletool.jar

      - name: Adicionar Bundletool ao PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device

            echo "Aguardando boot completo..."

            until adb shell getprop sys.boot_completed | tr -d '\r' | grep -q "1"; do
              sleep 2
            done

            echo "Boot concluído."

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            adb devices

            npm test

      - name: Capturar Logcat
        if: always()
        run: |
          adb logcat -d > logcat.txt || true

      - name: Upload do Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ./errorShots
            ./screenshots
          if-no-files-found: ignore