name: EBAC CI - Mobile

on:
  push:
    branches:
      - ci
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: npm ci

      # ============================================================
      # DIAGNÓSTICO
      # ============================================================

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ESTRUTURA DO PROJETO"
          echo "========================================"

          echo ""
          echo "TESTES:"

          find ./test -type f \
            \( -name "*.test.js" -o -name "*.spec.js" \) \
            -print

          echo ""
          echo "PAGE OBJECTS:"

          find ./test/pageobjects -type f -maxdepth 2 -print

          echo ""
          echo "PACKAGE.JSON:"

          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts,null,2))"

      # ============================================================
      # VALIDAR CADASTRO
      # ============================================================

      - name: Validar Cadastro.test.js
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDANDO CADASTRO"
          echo "========================================"

          test -f "./test/specs/Cadastro.test.js"

          echo "Cadastro.test.js encontrado."

      # ============================================================
      # VALIDAR APK
      # ============================================================

      - name: Validar APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDANDO APK"
          echo "========================================"

          test -f "./apps/ebacshop.apk"

          ls -lh "./apps/ebacshop.apk"

          file "./apps/ebacshop.apk"

          echo ""
          echo "SHA256:"
          sha256sum "./apps/ebacshop.apk"

      # ============================================================
      # KVM
      # ============================================================

      - name: Configurar KVM
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURANDO KVM"
          echo "========================================"

          test -e /dev/kvm

          sudo chmod 666 /dev/kvm

          ls -l /dev/kvm

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM DISPONÍVEL!"
          else
            echo "ERRO: KVM não está acessível."
            exit 1
          fi

      # ============================================================
      # ANDROID EMULATOR + APPIUM + TESTES
      # ============================================================

      - name: Executar testes Mobile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2

          force-avd-creation: true

          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect

          disable-animations: true

          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M

          emulator-boot-timeout: 600

          script: |
            echo "========================================"
            echo "ANDROID INICIADO"
            echo "========================================"

            echo ""
            echo "DISPOSITIVOS ADB:"
            adb devices

            echo ""
            echo "ANDROID:"
            adb shell getprop ro.build.version.release

            echo ""
            echo "API:"
            adb shell getprop ro.build.version.sdk

            echo ""
            echo "BOOT:"
            adb shell getprop sys.boot_completed

            echo ""
            echo "========================================"
            echo "INICIANDO APPIUM"
            echo "========================================"

            rm -f appium.log

            npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

            APPIUM_PID=$!

            echo "Appium PID: $APPIUM_PID"

            echo ""
            echo "Aguardando Appium..."

            APPIUM_READY="false"
            COUNT=0

            while [ "$COUNT" -lt 30 ]; do

              if curl -sf http://127.0.0.1:4723/status > /dev/null; then
                APPIUM_READY="true"
                echo "Appium está pronto!"
                break
              fi

              if ! kill -0 "$APPIUM_PID" 2>/dev/null; then
                echo ""
                echo "ERRO: Appium encerrou."
                echo ""
                echo "LOG DO APPIUM:"
                cat appium.log || true
                exit 1
              fi

              COUNT=$((COUNT + 1))

              echo "Tentativa $COUNT/30..."

              sleep 2

            done

            if [ "$APPIUM_READY" != "true" ]; then
              echo ""
              echo "ERRO: Appium não ficou disponível."
              echo ""
              echo "LOG DO APPIUM:"
              cat appium.log || true
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "APPIUM STATUS"
            echo "========================================"

            curl --fail http://127.0.0.1:4723/status

            echo ""
            echo "========================================"
            echo "APPIUM OK"
            echo "========================================"

            echo ""
            echo "========================================"
            echo "VERIFICANDO APLICATIVO"
            echo "========================================"

            adb shell pm list packages | grep "br.com.lojaebac" || true

            echo ""
            echo "========================================"
            echo "EXECUTANDO WDIO"
            echo "========================================"

            npm test

      # ============================================================
      # LOG DO APPIUM
      # ============================================================

      - name: Upload log do Appium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # RESULTADOS ALLURE
      # ============================================================

      - name: Verificar Allure Results
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "ALLURE RESULTS"
          echo "========================================"

          if [ -d "./allure-results" ]; then
            echo "Pasta encontrada."

            find ./allure-results \
              -maxdepth 2 \
              -type f \
              -print

          else
            echo "Nenhum allure-results encontrado."
          fi

      # ============================================================
      # GERAR ALLURE
      # ============================================================

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "GERANDO ALLURE REPORT"
          echo "========================================"

          rm -rf ./allure-report
          mkdir -p ./allure-report

          if [ -d "./allure-results" ] && \
             find "./allure-results" -type f -print -quit | grep -q .; then

            echo "Resultados encontrados."

            npx allure generate \
              ./allure-results \
              --clean \
              -o ./allure-report

            if [ ! -f "./allure-report/index.html" ]; then
              echo "ERRO: Allure não gerou index.html."
              exit 1
            fi

            echo ""
            echo "Allure gerado com sucesso."

          else

            echo "Nenhum resultado Allure encontrado."

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="pt-BR">' \
              '<head>' \
              '<meta charset="UTF-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1.0">' \
              '<title>EBAC Mobile - Allure Report</title>' \
              '</head>' \
              '<body>' \
              '<h1>EBAC Mobile - Allure Report</h1>' \
              '<p>Nenhum resultado Allure foi gerado nesta execução.</p>' \
              '</body>' \
              '</html>' \
              > ./allure-report/index.html

          fi

          echo ""
          echo "ARQUIVOS DO ALLURE:"

          find ./allure-report -maxdepth 2 -type f -print

      # ============================================================
      # UPLOAD ALLURE
      # ============================================================

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # GITHUB PAGES
      # ============================================================

      - name: Deploy to GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true