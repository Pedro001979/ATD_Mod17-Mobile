name: EBAC CI - Mobile

on:
  push:
    branches: [ci, main]
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Copiar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-29"
          sdkmanager "system-images;android-29;default;x86_64"

      - name: Criar emulador
        run: |
          echo "no" | avdmanager create avd \
            --name test \
            --package "system-images;android-29;default;x86_64" \
            --force

      - name: Iniciar emulador
        run: |
          nohup emulator \
            -avd test \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

      - name: Aguardar dispositivo Android
        timeout-minutes: 5
        run: |
          adb wait-for-device

          echo "Aguardando Android inicializar..."

          timeout 300 bash -c '
            until adb shell getprop sys.boot_completed 2>/dev/null | grep -m 1 "1"; do
              sleep 5
            done
          '

          echo "Android inicializado!"

      - name: Verificar dispositivo
        run: |
          adb devices
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk

      - name: Verificar aplicativo
        run: |
          if [ ! -f "./apps/ebacshop.apk" ]; then
            echo "ERRO: ./apps/ebacshop.apk não encontrado!"
            exit 1
          fi

          ls -lh ./apps/ebacshop.apk
          file ./apps/ebacshop.apk

      - name: Iniciar Appium
        run: |
          npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

          echo "Aguardando Appium..."

          timeout 60 bash -c '
            until curl -s http://127.0.0.1:4723/status > /dev/null; do
              sleep 2
            done
          '

          echo "Appium iniciado!"

      - name: Rodar testes mobile
        run: npm test

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-logs
          path: |
            emulator.log
            appium.log