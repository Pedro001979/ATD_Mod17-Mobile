name: Mobile Tests - WebdriverIO + Appium

on:
  push:
    branches: [main, master, ci]
  pull_request:
    branches: [main, master, ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2

      - name: Verify project
        run: |
          node --version
          npm --version
          npx appium --version
          npx appium driver list --installed
          test -f apps/ebacshop.apk
          file apps/ebacshop.apk

      - name: Run Android tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e

            adb wait-for-device

            for i in $(seq 1 60); do
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$boot" = "1" ]; then break; fi
              sleep 5
            done

            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
              echo 'Android emulator did not finish booting.'
              adb logcat -d | tail -n 300 || true
              exit 1
            fi

            adb devices -l

            npx appium --port 4723 > appium.log 2>&1 &
            APPIUM_PID=$!
            trap 'kill $APPIUM_PID 2>/dev/null || true' EXIT

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4723/status >/dev/null; then break; fi
              sleep 2
            done

            curl -fsS http://127.0.0.1:4723/status
            npm test

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-diagnostics
          path: |
            appium.log
            errorShots/
            screenshots/
            allure-results/
          if-no-files-found: ignore
