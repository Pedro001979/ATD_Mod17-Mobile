name: Executar Testes Mobile (WebdriverIO + Appium)

on:
  push:
    branches: [ main, master, ci ]
  pull_request:
    branches: [ main, master, ci ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Baixar arquivos Git LFS
        run: git lfs pull

      - name: Verificar arquivo do app
        run: |
          ls -lh apps
          file apps/ebacshop.apks
          head -c 20 apps/ebacshop.apks | xxd

      - name: Habilitar KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo chmod 666 /dev/kvm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      ##################################################################
      # Instalação do Bundletool
      ##################################################################

      - name: Instalar Bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

          sudo mkdir -p /opt/bundletool

          sudo mv bundletool-all-1.18.1.jar /opt/bundletool/bundletool.jar

          sudo ln -sf /opt/bundletool/bundletool.jar /usr/local/bin/bundletool.jar

          sudo tee /usr/local/bin/bundletool > /dev/null << 'EOF'
          #!/bin/bash
          exec java -jar /usr/local/bin/bundletool.jar "$@"
          EOF

          sudo chmod +x /usr/local/bin/bundletool

      - name: Validar instalação do Bundletool
        run: |
          echo "PATH=$PATH"

          which java
          java -version

          which bundletool || true
          which bundletool.jar || true

          ls -l /usr/local/bin/bundletool*
          ls -l /opt/bundletool

          bundletool version

      ##################################################################

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar versões
        run: |
          node -v
          npm -v
          appium --version
          npm ls appium
          npm ls appium-uiautomator2-driver

      - name: Executar testes no Emulador Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics
          script: |
            echo "======= DEVICES ======="
            adb devices

            echo "======= BUNDLETOOL ======="
            which bundletool || true
            which bundletool.jar || true
            bundletool version || true

            echo "======= APPIUM ======="
            appium --version

            echo "======= TESTES ======="
            npm test

      - name: Capturar Logcat
        if: always()
        run: |
          adb logcat -d > logcat.txt || true

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore

      - name: Upload Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ./errorShots
            ./screenshots
          if-no-files-found: ignore