name: EBAC CI - Mobile

on:
  push:
    branches:
      - ci
      - main
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar estrutura dos testes
        shell: bash
        run: |
          echo "========================================"
          echo "TESTES ENCONTRADOS"
          echo "========================================"

          find . -type f \
            \( -name "*.test.js" -o -name "*.spec.js" \) \
            -print

      - name: Verificar teste de cadastro
        shell: bash
        run: |
          if [ ! -f "./test/specs/Cadastro.test.js" ]; then
            echo "ERRO: teste Cadastro.test.js não encontrado!"
            exit 1
          fi

          echo "Teste encontrado com sucesso!"

      - name: Verificar Page Objects
        shell: bash
        run: |
          if [ ! -d "./test/pageobjects" ]; then
            echo "ERRO: pasta test/pageobjects não encontrada!"
            exit 1
          fi

          find ./test/pageobjects -maxdepth 1 -type f -print

      - name: Verificar APK
        shell: bash
        run: |
          if [ ! -f "./apps/ebacshop.apk" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh ./apps/ebacshop.apk

      - name: Habilitar KVM
        shell: bash
        run: |
          echo "========================================"
          echo "CONFIGURANDO KVM"
          echo "========================================"

          if [ ! -e /dev/kvm ]; then
            echo "ERRO: /dev/kvm não existe!"
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          ls -l /dev/kvm

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM DISPONÍVEL!"
          else
            echo "ERRO: KVM não está acessível!"
            exit 1
          fi

      - name: Executar testes Mobile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2

          force-avd-creation: true

          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect

          disable-animations: true

          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M

          emulator-boot-timeout: 600

          script: |
            echo "========================================"
            echo "ANDROID"
            echo "========================================"

            adb wait-for-device
            adb devices

            echo ""
            echo "Android:"
            adb shell getprop ro.build.version.release

            echo ""
            echo "API:"
            adb shell getprop ro.build.version.sdk

            echo ""
            echo "Boot:"
            adb shell getprop sys.boot_completed

            echo ""
            echo "========================================"
            echo "EXECUTANDO WDIO"
            echo "========================================"

            npm test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-logs
          path: |
            logs/
            allure-results/
          if-no-files-found: ignore