name: EBAC CI - Mobile

on:
  push:
    branches:
      - ci
      - main
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar estrutura dos testes
        shell: bash
        run: |
          echo "========================================"
          echo "TESTES ENCONTRADOS"
          echo "========================================"

          find . -type f \
            \( -name "*.test.js" -o -name "*.spec.js" \) \
            -print

      - name: Verificar teste de cadastro
        shell: bash
        run: |
          if [ ! -f "./test/specs/Cadastro.test.js" ]; then
            echo "========================================"
            echo "ERRO: TESTE NÃO ENCONTRADO"
            echo "========================================"

            echo "Procurado:"
            echo "./test/specs/Cadastro.test.js"

            echo ""
            echo "Testes disponíveis:"
            find . -type f \
              \( -name "*.test.js" -o -name "*.spec.js" \) \
              -print

            exit 1
          fi

          echo "Teste encontrado com sucesso!"

      - name: Verificar APK
        shell: bash
        run: |
          if [ ! -f "./apps/ebacshop.apk" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh ./apps/ebacshop.apk

      - name: Executar testes Mobile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2

          force-avd-creation: true

          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect

          disable-animations: true

          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M

          emulator-boot-timeout: 600

          script: |
            echo "========================================"
            echo "ANDROID"
            echo "========================================"

            adb devices

            echo ""
            echo "Android:"
            adb shell getprop ro.build.version.release

            echo ""
            echo "API:"
            adb shell getprop ro.build.version.sdk

            echo ""
            echo "Boot:"
            adb shell getprop sys.boot_completed

            echo ""
            echo "========================================"
            echo "VERIFICANDO ADB"
            echo "========================================"

            adb wait-for-device

            adb devices

            echo ""
            echo "========================================"
            echo "INICIANDO APPIUM"
            echo "========================================"

            npx appium \
              --address 127.0.0.1 \
              --port 4723 \
              > appium.log 2>&1 &

            APPIUM_PID=$!

            echo "Appium PID: $APPIUM_PID"

            echo ""
            echo "========================================"
            echo "AGUARDANDO APPIUM"
            echo "========================================"

            APPIUM_READY=false

            for i in {1..30}; do
              if curl -sf http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium está pronto!"

                APPIUM_READY=true
                break
              fi

              echo "Aguardando Appium... tentativa $i/30"
              sleep 2
            done

            if [ "$APPIUM_READY" != "true" ]; then
              echo "========================================"
              echo "ERRO: APPIUM NÃO INICIOU"
              echo "========================================"

              cat appium.log || true

              exit 1
            fi

            echo ""
            echo "========================================"
            echo "STATUS APPIUM"
            echo "========================================"

            curl --fail http://127.0.0.1:4723/status

            echo ""
            echo "========================================"
            echo "APPIUM OK"
            echo "========================================"

            echo ""
            echo "========================================"
            echo "EXECUTANDO TESTES"
            echo "========================================"

            npm test

      - name: Coletar logcat Android
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "COLETANDO LOGCAT"
          echo "========================================"

          adb logcat -d > android-logcat.txt || true

          echo "Logcat coletado."

      - name: Upload do log do Appium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore

      - name: Upload logs Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-logs
          path: android-logcat.txt
          if-no-files-found: ignore